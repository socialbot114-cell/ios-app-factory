name: IOSAppFactory
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
    CODE_SIGNING_ALLOWED: NO
    ENABLE_PREVIEWS: YES
targets:
  AtelieColorir:
    type: application
    platform: iOS
    sources: [FactoryShared, apps/atelie-colorir/Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.socialbot114.factory.ateliecolorir
        INFOPLIST_KEY_CFBundleDisplayName: Ateliê de Colorir
  AtelieColorirTests:
    type: bundle.unit-test
    platform: iOS
    sources: [apps/atelie-colorir/Tests]
    dependencies: [{target: AtelieColorir}]
  AtelieColorirUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [apps/atelie-colorir/UITests]
    dependencies: [{target: AtelieColorir}]
    settings: {base: {TEST_TARGET_NAME: AtelieColorir}}
  CrimeIdle:
    type: application
    platform: iOS
    sources: [FactoryShared, apps/crime-idle/Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.socialbot114.factory.crimeidle
        INFOPLIST_KEY_CFBundleDisplayName: Crime Idle
  CrimeIdleTests:
    type: bundle.unit-test
    platform: iOS
    sources: [apps/crime-idle/Tests]
    dependencies: [{target: CrimeIdle}]
  CrimeIdleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [apps/crime-idle/UITests]
    dependencies: [{target: CrimeIdle}]
    settings: {base: {TEST_TARGET_NAME: CrimeIdle}}
  DetetiveNaTesta:
    type: application
    platform: iOS
    sources: [FactoryShared, apps/detetive-na-testa/Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.socialbot114.factory.detetivenatesta
        INFOPLIST_KEY_CFBundleDisplayName: Detetive na Testa
  DetetiveNaTestaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [apps/detetive-na-testa/Tests]
    dependencies: [{target: DetetiveNaTesta}]
  DetetiveNaTestaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [apps/detetive-na-testa/UITests]
    dependencies: [{target: DetetiveNaTesta}]
    settings: {base: {TEST_TARGET_NAME: DetetiveNaTesta}}
  ManagerFutebol:
    type: application
    platform: iOS
    sources: [FactoryShared, apps/manager-futebol/Sources, apps/manager-futebol/Core, apps/manager-futebol/Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.sejao.tecnico.soccer
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: apps/manager-futebol/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Manager de Futebol
  ManagerFutebolTests:
    type: bundle.unit-test
    platform: iOS
    sources: [apps/manager-futebol/Tests]
    dependencies: [{target: ManagerFutebol}]
  ManagerFutebolUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [apps/manager-futebol/UITests]
    dependencies: [{target: ManagerFutebol}]
    settings: {base: {TEST_TARGET_NAME: ManagerFutebol}}
  MeuQrPix:
    type: application
    platform: iOS
    sources: [FactoryShared, apps/meu-qr-pix/Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.socialbot114.factory.meuqrpix
        INFOPLIST_KEY_CFBundleDisplayName: Meu QR Pix
  MeuQrPixTests:
    type: bundle.unit-test
    platform: iOS
    sources: [apps/meu-qr-pix/Tests]
    dependencies: [{target: MeuQrPix}]
  MeuQrPixUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [apps/meu-qr-pix/UITests]
    dependencies: [{target: MeuQrPix}]
    settings: {base: {TEST_TARGET_NAME: MeuQrPix}}
  LeitorPdfBolso:
    type: application
    platform: iOS
    sources: [FactoryShared, apps/leitor-pdf-bolso/Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.socialbot114.factory.leitorpdf
        INFOPLIST_KEY_CFBundleDisplayName: Leitor PDF de Bolso
  LeitorPdfBolsoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [apps/leitor-pdf-bolso/Tests]
    dependencies: [{target: LeitorPdfBolso}]
  LeitorPdfBolsoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [apps/leitor-pdf-bolso/UITests]
    dependencies: [{target: LeitorPdfBolso}]
    settings: {base: {TEST_TARGET_NAME: LeitorPdfBolso}}
  BrasiliaPolitica:
    type: application
    platform: iOS
    sources: [FactoryShared, apps/brasilia-politica-contexto/Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.socialbot114.factory.brasiliapolitica
        INFOPLIST_KEY_CFBundleDisplayName: Brasília Política
  BrasiliaPoliticaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [apps/brasilia-politica-contexto/Tests]
    dependencies: [{target: BrasiliaPolitica}]
  BrasiliaPoliticaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [apps/brasilia-politica-contexto/UITests]
    dependencies: [{target: BrasiliaPolitica}]
    settings: {base: {TEST_TARGET_NAME: BrasiliaPolitica}}
  DiarioSono:
    type: application
    platform: iOS
    sources: [FactoryShared, apps/diario-sono/Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.socialbot114.factory.diariosono
        INFOPLIST_KEY_CFBundleDisplayName: Diário do Sono
  DiarioSonoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [apps/diario-sono/Tests]
    dependencies: [{target: DiarioSono}]
  DiarioSonoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [apps/diario-sono/UITests]
    dependencies: [{target: DiarioSono}]
    settings: {base: {TEST_TARGET_NAME: DiarioSono}}
  HallDasLendas:
    type: application
    platform: iOS
    sources: [FactoryShared, apps/hall-das-lendas/Sources, apps/hall-das-lendas/Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.socialbot114.factory.halldaslendas
        INFOPLIST_KEY_CFBundleDisplayName: Hall das Lendas
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
  HallDasLendasTests:
    type: bundle.unit-test
    platform: iOS
    sources: [apps/hall-das-lendas/Tests]
    dependencies: [{target: HallDasLendas}]
  HallDasLendasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [apps/hall-das-lendas/UITests]
    dependencies: [{target: HallDasLendas}]
    settings: {base: {TEST_TARGET_NAME: HallDasLendas}}
  QuebraCabecas:
    type: application
    platform: iOS
    sources: [FactoryShared, apps/quebra-cabecas/Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.socialbot114.factory.quebracabecas
        INFOPLIST_KEY_CFBundleDisplayName: Quebra-Cabeças
  QuebraCabecasTests:
    type: bundle.unit-test
    platform: iOS
    sources: [apps/quebra-cabecas/Tests]
    dependencies: [{target: QuebraCabecas}]
  QuebraCabecasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [apps/quebra-cabecas/UITests]
    dependencies: [{target: QuebraCabecas}]
    settings: {base: {TEST_TARGET_NAME: QuebraCabecas}}
schemes:
  AtelieColorir:
    build: {targets: {AtelieColorir: all, AtelieColorirTests: [test], AtelieColorirUITests: [test]}}
    test: {targets: [AtelieColorirTests, AtelieColorirUITests]}
  CrimeIdle:
    build: {targets: {CrimeIdle: all, CrimeIdleTests: [test], CrimeIdleUITests: [test]}}
    test: {targets: [CrimeIdleTests, CrimeIdleUITests]}
  DetetiveNaTesta:
    build: {targets: {DetetiveNaTesta: all, DetetiveNaTestaTests: [test], DetetiveNaTestaUITests: [test]}}
    test: {targets: [DetetiveNaTestaTests, DetetiveNaTestaUITests]}
  ManagerFutebol:
    build: {targets: {ManagerFutebol: all, ManagerFutebolTests: [test], ManagerFutebolUITests: [test]}}
    test: {targets: [ManagerFutebolTests, ManagerFutebolUITests]}
  MeuQrPix:
    build: {targets: {MeuQrPix: all, MeuQrPixTests: [test], MeuQrPixUITests: [test]}}
    test: {targets: [MeuQrPixTests, MeuQrPixUITests]}
  LeitorPdfBolso:
    build: {targets: {LeitorPdfBolso: all, LeitorPdfBolsoTests: [test], LeitorPdfBolsoUITests: [test]}}
    test: {targets: [LeitorPdfBolsoTests, LeitorPdfBolsoUITests]}
  BrasiliaPolitica:
    build: {targets: {BrasiliaPolitica: all, BrasiliaPoliticaTests: [test], BrasiliaPoliticaUITests: [test]}}
    test: {targets: [BrasiliaPoliticaTests, BrasiliaPoliticaUITests]}
  DiarioSono:
    build: {targets: {DiarioSono: all, DiarioSonoTests: [test], DiarioSonoUITests: [test]}}
    test: {targets: [DiarioSonoTests, DiarioSonoUITests]}
  QuebraCabecas:
    build: {targets: {QuebraCabecas: all, QuebraCabecasTests: [test], QuebraCabecasUITests: [test]}}
    test: {targets: [QuebraCabecasTests, QuebraCabecasUITests]}
  HallDasLendas:
    build: {targets: {HallDasLendas: all, HallDasLendasTests: [test], HallDasLendasUITests: [test]}}
    test: {targets: [HallDasLendasTests, HallDasLendasUITests]}
